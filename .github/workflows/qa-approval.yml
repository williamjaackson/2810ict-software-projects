name: QA Approval

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - labeled
      - unlabeled
      - ready_for_review
      - converted_to_draft
  pull_request_review:
    types:
      - submitted
      - dismissed
      - edited

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  qa-approval:
    name: qa-approval
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const QA_REVIEWER = 'EthanRR11';
            const SKIP_LABEL = 'skip-qa';
            const MARKER = '<!-- qa-approval-check -->';

            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;

            // Read fresh state rather than trusting the event payload: rapid
            // label/review clicks can deliver a payload that is already stale,
            // and a false red on a correct PR is the worst outcome here.
            const { data: pr } = await github.rest.pulls.get({
              owner,
              repo,
              pull_number: issue_number,
            });

            const sameUser = (login) =>
              (login || '').toLowerCase() === QA_REVIEWER.toLowerCase();

            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner,
              repo,
              pull_number: issue_number,
              per_page: 100,
            });
            const pythonFiles = files
              .filter((file) => file.status !== 'removed')
              .map((file) => file.filename)
              .filter((filename) => filename.endsWith('.py'));

            const labels = (pr.labels || []).map((label) => label.name);

            // Resolve the reviewer's standing: COMMENTED reviews do not change
            // approval state, so only APPROVED / CHANGES_REQUESTED / DISMISSED
            // count, and the most recent of those wins.
            const reviews = await github.paginate(github.rest.pulls.listReviews, {
              owner,
              repo,
              pull_number: issue_number,
              per_page: 100,
            });
            const decisive = reviews.filter(
              (review) =>
                sameUser(review.user && review.user.login) &&
                review.state !== 'COMMENTED',
            );
            const latest = decisive[decisive.length - 1];

            let passed;
            let reason;

            if (pythonFiles.length === 0) {
              passed = true;
              reason = 'No Python changes — QA approval is not required.';
            } else if (labels.includes(SKIP_LABEL)) {
              passed = true;
              reason = 'QA gate bypassed via the `' + SKIP_LABEL + '` label.';
            } else if (sameUser(pr.user && pr.user.login)) {
              // GitHub forbids self-approval, so without this the gate would be
              // unsatisfiable on the reviewer's own PRs. The repo's separate
              // one-approval rule still applies to them.
              passed = true;
              reason = 'Authored by @' + QA_REVIEWER + ' — self-approval is not possible.';
            } else if (latest && latest.state === 'APPROVED') {
              passed = true;
              reason = 'Approved by @' + QA_REVIEWER + '.';
            } else if (latest && latest.state === 'CHANGES_REQUESTED') {
              passed = false;
              reason = '@' + QA_REVIEWER + ' requested changes.';
            } else if (latest && latest.state === 'DISMISSED') {
              // master has dismiss_stale_reviews enabled, so new commits land here.
              passed = false;
              reason =
                'The approval from @' + QA_REVIEWER + ' was dismissed — a fresh review is needed.';
            } else {
              passed = false;
              reason = 'This PR changes Python files and needs approval from @' + QA_REVIEWER + '.';
            }

            const body = [
              MARKER,
              '### QA approval required',
              '',
              reason,
              '',
              'Add the `' + SKIP_LABEL + '` label to bypass this gate.',
            ].join('\n');

            // Ask for the review the gate is waiting on. Only when nobody has
            // reviewed yet or the approval went stale: re-requesting straight
            // after a CHANGES_REQUESTED would nag the reviewer for work that is
            // now the author's, and re-requesting an already-open request would
            // fire a fresh notification on every push.
            const alreadyRequested = (pr.requested_reviewers || []).some(
              (user) => sameUser(user.login),
            );
            const wantsReview = !latest || latest.state === 'DISMISSED';
            if (!passed && wantsReview && !alreadyRequested) {
              try {
                await github.rest.pulls.requestReviewers({
                  owner,
                  repo,
                  pull_number: issue_number,
                  reviewers: [QA_REVIEWER],
                });
              } catch (error) {
                core.warning(
                  'Could not request a review from @' + QA_REVIEWER + ': ' + error.message,
                );
              }
            }

            await core.summary
              .addRaw(
                passed
                  ? '### QA approval satisfied\n\n' + reason
                  : body.replace(MARKER + '\n', ''),
              )
              .write();

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
              per_page: 100,
            });
            const existing = comments.find((comment) => (comment.body || '').includes(MARKER));

            // A PR from a fork gets a read-only GITHUB_TOKEN, so these calls can 403.
            // The step summary above already carries the reason, so a failure to
            // comment must not mask the real pass/fail result.
            try {
              if (passed) {
                if (existing) {
                  await github.rest.issues.deleteComment({ owner, repo, comment_id: existing.id });
                }
              } else if (!existing) {
                await github.rest.issues.createComment({ owner, repo, issue_number, body });
              } else if (existing.body !== body) {
                await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
              }
            } catch (error) {
              core.warning('Could not update the PR comment: ' + error.message);
            }

            if (!passed) {
              core.setFailed(reason);
            }
