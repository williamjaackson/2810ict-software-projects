name: PR Requirements

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - edited
      - labeled
      - unlabeled
      - assigned
      - unassigned
      - ready_for_review
      - converted_to_draft

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  pr-requirements:
    name: pr-requirements
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const TYPE_LABELS = ['feature', 'bug', 'chore', 'refactor'];
            const MARKER = '<!-- pr-requirements-check -->';

            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;

            // Read fresh state rather than trusting the event payload: rapid
            // label/assign clicks can deliver a payload that is already stale,
            // and a false red on a correct PR is the worst outcome here.
            const { data: pr } = await github.rest.pulls.get({
              owner,
              repo,
              pull_number: issue_number,
            });

            const assignees = pr.assignees || [];
            const labels = (pr.labels || []).map((label) => label.name);
            const typeLabels = labels.filter((name) => TYPE_LABELS.includes(name));

            const reasons = [];
            if (assignees.length === 0) {
              reasons.push('**No assignee** — assign someone to this PR.');
            }
            if (typeLabels.length === 0) {
              const list = TYPE_LABELS.map((name) => '`' + name + '`').join(', ');
              reasons.push('**No type label** — add one of: ' + list + '.');
            }

            const passed = reasons.length === 0;

            const body = [
              MARKER,
              '### This PR is missing something',
              '',
              ...reasons.map((reason) => '- ' + reason),
            ].join('\n');

            await core.summary
              .addRaw(passed
                ? '### PR requirements met\n\nAssignee and type label are both present.'
                : body.replace(MARKER + '\n', ''))
              .write();

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
              per_page: 100,
            });
            const existing = comments.find((comment) => (comment.body || '').includes(MARKER));

            // A PR from a fork gets a read-only GITHUB_TOKEN, so these calls can 403.
            // The step summary above already carries the reasons, so a failure to
            // comment must not mask the real pass/fail result.
            try {
              if (passed) {
                if (existing) {
                  await github.rest.issues.deleteComment({ owner, repo, comment_id: existing.id });
                }
              } else if (!existing) {
                await github.rest.issues.createComment({ owner, repo, issue_number, body });
              } else if (existing.body !== body) {
                await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
              }
            } catch (error) {
              core.warning('Could not update the PR comment: ' + error.message);
            }

            if (!passed) {
              core.setFailed(reasons.join(' '));
            }
